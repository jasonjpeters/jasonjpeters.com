<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      ;(() => {
        const storedTheme = localStorage.getItem('terminal-theme')
        const theme =
          storedTheme === 'light' || storedTheme === 'dark'
            ? storedTheme
            : window.matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.classList.add(theme)
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Technical writing, web development notes, infrastructure experiments, and project work from Jason Peters."
    />
    <link rel="canonical" href="https://jasonjpeters.com/" />
    <link rel="alternate" type="application/rss+xml" title="Jason Peters Feed" href="/feed.xml" />
    <title>Jason Peters | Software, Web, and Systems Development</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
